services:
  db:
    image: postgres:16
    container_name: iku-ai-db-dev
    environment:
      POSTGRES_DB: iku-ai-db-dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 5656
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - iku-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iku-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - iku-network
    restart: unless-stopped

  backend:
    build: 
      context: .  # 루트 디렉토리로 변경
      dockerfile: backend/Dockerfile.dev
    container_name: iku-backend-dev
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://db:5432/iku-ai-db-dev
      - DB_USERNAME=user
      - DB_PASSWORD=5656
      - SHOW_SQL=true
      - LOG_LEVEL_APP=DEBUG
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - iku-network
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src:ro  # 소스 코드 핫 리로드
      - ./backend/build:/app/build

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_BASE_URL: https://iku.life
        VITE_CLERK_PUBLISHABLE_KEY: pk_test_Z2l2aW5nLW9jZWxvdC01OS5jbGVyay5hY2NvdW50cy5kZXYk
        NODE_ENV: development
    container_name: iku-frontend-dev
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - iku-network
    restart: unless-stopped

volumes:
  pgdata_dev:
  redis_data_dev:

networks:
  iku-network:
    driver: bridge
