services:
  db:
    image: postgres:16
    container_name: iku-ai-db-prod
    environment:
      POSTGRES_DB: iku-ai-db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./backup:/backup:ro  # 백업 디렉토리
    networks:
      - iku-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: iku-backend-prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/iku-ai-db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SHOW_SQL=false
      - LOG_LEVEL_APP=WARN
      - FLYWAY_ENABLED=true
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - iku-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: '0.5'

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iku-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=http://backend:8080
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - iku-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: '0.25'

  # ======================
  # Nginx 리버스 프록시 (나중에 필요시 활성화)
  # ======================
  # nginx:
  #   image: nginx:alpine
  #   container_name: iku-nginx-prod
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - iku-network
  #   restart: always

volumes:
  pgdata_prod:

networks:
  iku-network:
    driver: bridge
