server:
  port: 8080

spring:
  # profiles.active 제거 - 이 줄을 삭제하세요!
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://db-main:5432/iku-main-db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:5656}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

