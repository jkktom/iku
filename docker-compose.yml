version: '3.8'

services:
  # ======================
  # Main 브랜치 서비스들 (프로덕션)
  # ======================
  db-main:
    image: postgres:16
    container_name: iku-main-db
    environment:
      POSTGRES_DB: iku-main-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 5656
    ports:
      - "5432:5432"
    volumes:
      - pgdata-main:/var/lib/postgresql/data
    networks:
      - iku-main-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iku-main-backend
    environment:
      - SPRING_PROFILES_ACTIVE=main
      - DB_URL=jdbc:postgresql://db-main:5432/iku-main-db
      - DB_USERNAME=user
      - DB_PASSWORD=5656
      - SERVER_PORT=8080
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    env_file:
      - backend/.env
    ports:
      - "8080:8080"
    depends_on:
      db-main:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iku-main-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend-main:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iku-main-frontend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=https://iku.life
    env_file:
      - frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend-main
    networks:
      - iku-main-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ======================
  # Dev 브랜치 서비스들 (개발)
  # ======================
  db-dev:
    image: postgres:16
    container_name: iku-dev-db
    environment:
      POSTGRES_DB: iku-dev-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 5656
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    networks:
      - iku-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: iku-dev-backend
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db-dev:5432/iku-dev-db
      - DB_USERNAME=user
      - DB_PASSWORD=5656
      - SERVER_PORT=8080
      - SHOW_SQL=true
      - LOG_LEVEL_APP=DEBUG
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - backend/.env
    ports:
      - "8081:8080"
    depends_on:
      db-dev:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro  # 소스 코드 핫 리로드
      - gradle-cache:/app/.gradle
      - ./backend/build:/app/build
    networks:
      - iku-dev-network
    restart: unless-stopped

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: iku-dev-frontend
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=https://iku.life
    env_file:
      - frontend/.env
    ports:
      - "3001:3000"
    depends_on:
      - backend-dev
    volumes:
      - ./frontend/app:/app/app:ro  # 소스 코드 핫 리로드
      - ./frontend/public:/app/public:ro
      - node-modules-dev:/app/node_modules
    networks:
      - iku-dev-network
    restart: unless-stopped

  # ======================
  # Nginx 리버스 프록시
  # ======================
  nginx:
    image: nginx:alpine
    container_name: iku-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend-main
      - backend-main
    networks:
      - iku-main-network
    restart: unless-stopped

  # ======================
  # Redis (캐시 서버)
  # ======================
  redis:
    image: redis:7-alpine
    container_name: iku-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - iku-main-network
      - iku-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ======================
  # 개발용 추가 서비스들 (선택사항)
  # ======================
  adminer:
    image: adminer
    container_name: iku-adminer
    ports:
      - "8082:8080"
    networks:
      - iku-main-network
      - iku-dev-network
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db-main

# ======================
# 볼륨 설정
# ======================
volumes:
  pgdata-main:
    driver: local
  pgdata-dev:
    driver: local
  redis-data:
    driver: local
  gradle-cache:
    driver: local
  node-modules-dev:
    driver: local

# ======================
# 네트워크 설정
# ======================
networks:
  iku-main-network:
    driver: bridge
  iku-dev-network:
    driver: bridge
