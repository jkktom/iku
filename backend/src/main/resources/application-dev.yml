# Dev 브랜치 전용 설정
server:
  port: 8080

spring:
  profiles:
    active: dev
    
  datasource:
    url: ${DB_URL:jdbc:postgresql://db-dev:5432/iku-dev-db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:5656}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      
  jpa:
    hibernate:
      ddl-auto: update    # 개발에서는 update 사용
    show-sql: true       # 개발에서는 SQL 로그 출력
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          auto: create-drop  # 개발에서는 create-drop
          
  flyway:
    enabled: false       # 개발에서는 flyway 비활성화

# 로깅 설정 (개발)
logging:
  level:
    org.mtvs: DEBUG
    org.springframework: INFO
    org.hibernate: INFO
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 개발용 설정
management:
  endpoints:
    web:
      exposure:
        include: "*"  # 개발환경에서는 모든 actuator 엔드포인트 노출
  endpoint:
    health:
      show-details: always

# 기타 설정들 (기존 설정 유지)
chat:
  md-json:
    storage-dir: ./md-reports

gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
    key: ${GEMINI_API_KEY}

naver:
  api:
    id: ${NAVER_API_ID}
    secret: ${NAVER_API_SECRET}

jwt:
  secret: ${JWT_SECRET:4a8NRS86guvb1rzq1vlFPXOR4Nx96iKv4lnBAzDx8xo=}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
  guest-token-expiration: 3600000

clerk:
  domain: giving-ocelot-59.clerk.accounts.dev
  secret-key: ${CLERK_SECRET_KEY}

riot:
  api:
    key: ${RIOT_API_KEY}
