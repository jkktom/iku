# Main 브랜치 전용 설정
server:
  port: 8080

spring:
  profiles:
    active: main
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://db-main:5432/iku-main-db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:5656}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      
  jpa:
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 validate 사용
    show-sql: false      # 프로덕션에서는 false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
  flyway:
    enabled: true        # 프로덕션에서는 flyway 활성화
    baseline-on-migrate: true
    baseline-version: 1

# 로깅 설정 (프로덕션)
logging:
  level:
    org.mtvs: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 기타 설정들 (기존 설정 유지)
chat:
  md-json:
    storage-dir: ./md-reports

gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
    key: ${GEMINI_API_KEY}

naver:
  api:
    id: ${NAVER_API_ID}
    secret: ${NAVER_API_SECRET}

jwt:
  secret: ${JWT_SECRET:4a8NRS86guvb1rzq1vlFPXOR4Nx96iKv4lnBAzDx8xo=}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
  guest-token-expiration: 3600000

clerk:
  domain: giving-ocelot-59.clerk.accounts.dev
  secret-key: ${CLERK_SECRET_KEY}

riot:
  api:
    key: ${RIOT_API_KEY}
