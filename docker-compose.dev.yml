services:
  db:
    image: postgres:16
    container_name: iku-ai-db-dev
    environment:
      POSTGRES_DB: iku-ai-db-dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 5656
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - iku-network
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: iku-backend-dev
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://db:5432/iku-ai-db-dev
      - DB_USERNAME=user
      - DB_PASSWORD=5656
      - SHOW_SQL=true
      - LOG_LEVEL_APP=DEBUG
    env_file:
      - ./backend/.env
    depends_on:
      - db
    networks:
      - iku-network
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src:ro  # 소스 코드 핫 리로드
      - ./backend/build:/app/build

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: iku-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8080
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - iku-network
    restart: unless-stopped
    volumes:
      - ./frontend/app:/app/app:ro  # 소스 코드 핫 리로드
      - /app/node_modules

volumes:
  pgdata_dev:

networks:
  iku-network:
    driver: bridge
